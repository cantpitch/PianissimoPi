# PianissimoPi settings. Installed to /etc/pianissimopi.conf.
# Edit, then: sudo systemctl restart pianissimopi

# Piano sample set (SF2). install.sh puts the Salamander Grand Piano here.
SOUNDFONT=/usr/local/share/pianissimopi/piano.sf2

# ALSA output device. List devices with: aplay -l
#   USB audio interface / DAC:  hw:CARD=Device  (or plughw:1,0)
#   HiFiBerry DAC HAT:          hw:CARD=sndrpihifiberry
#   Pi 4 headphone jack:        hw:CARD=Headphones   (works, but noisy)
AUDIO_DEVICE=default

SAMPLE_RATE=48000

# Latency = PERIOD_SIZE * PERIODS / SAMPLE_RATE  (64*3/48000 ≈ 4 ms).
# Raise PERIOD_SIZE to 128 or 256 if you hear clicks or crackles.
PERIOD_SIZE=64
PERIODS=3

# Master volume, 0.0-10.0. Keep it low to avoid clipping on big chords.
GAIN=0.6

# Simultaneous voices. 128 is comfortable on a Pi 4/5 (sustain pedal eats voices fast).
POLYPHONY=128

# Reverb: 1 = on, 0 = off. ROOM_SIZE and REVERB_LEVEL are 0.0-1.0.
REVERB=1
ROOM_SIZE=0.5
REVERB_LEVEL=0.4

# CPU speed policy while the synth runs. "performance" keeps the CPU at full
# speed so clock changes don't cause clicks; the Pi runs warmer, so use a
# heatsink or case fan. Empty = leave the system default (usually "ondemand").
CPU_GOVERNOR=performance

# Only connect MIDI inputs whose name contains this text. Empty = every keyboard.
MIDI_MATCH=SE49
